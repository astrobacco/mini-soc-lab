<!-- Shared config for agents in group "linux-servers" (pushed by the manager) -->
<agent_config>
  <!-- File integrity monitoring: alert immediately when the website changes (web shells!) -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/html</directories>
  </syscheck>

  <!-- Web server logs: Wazuh detects SQL injection, XSS, path traversal, scanners ... -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>
</agent_config>
