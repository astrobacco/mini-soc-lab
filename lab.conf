# Mini-SOC lab settings
# ---------------------
# Edit this file BEFORE running ./setup.sh. Values here are read by setup.sh
# and by the Vagrantfile. An environment variable with the same name wins,
# e.g.  KALI_GUI=true ./setup.sh

# --- Software versions (tested combination) ---------------------------------
OPNSENSE_RELEASE=26.1
WAZUH_VERSION=4.14.8
IRIS_VERSION=v2.4.29

# --- Which VMs to build (fw and wazuh are always built) ----------------------
ENABLE_SOC=true        # Greenbone + DFIR-IRIS
ENABLE_SENSOR=true     # Suricata IDS
ENABLE_TARGET=true     # vulnerable victim server
ENABLE_KALI=true       # attacker

# --- Resources per VM (memory in MB) ----------------------------------------
# Full lab needs ~19 GB RAM for the VMs. On a 16 GB host, disable the soc VM
# or lower WAZUH_MEMORY to 4096.
FW_MEMORY=1536
FW_CPUS=2
WAZUH_MEMORY=6144
WAZUH_CPUS=2
SOC_MEMORY=6144
SOC_CPUS=2
SENSOR_MEMORY=2048
SENSOR_CPUS=1
TARGET_MEMORY=1536
TARGET_CPUS=1
KALI_MEMORY=2048
KALI_CPUS=2

# Open the Kali desktop window when the VM starts
KALI_GUI=false

# --- Ports on your computer (http(s)://localhost:<port>) ---------------------
PORT_OPNSENSE=8443
PORT_WAZUH=8444
PORT_IRIS=8445
PORT_GREENBONE=9392
PORT_TARGET=8446     # the practice server (DVWA) - so you can browse it by hand, not just attack it from kali
